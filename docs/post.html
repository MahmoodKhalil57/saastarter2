  <body>
    <s2-nav></s2-nav>
    <main class="container" style="max-inline-size: 42rem">
      <article id="article"><p class="s2-quiet">Loading…</p></article>
    </main>
    <s2-footer></s2-footer>
    <script type="module">
      import { post } from "./js/store.js";
      const id = new URLSearchParams(location.search).get("id");
      const vt = id ? `view-transition-name:post-${id}` : "";
      if (id) document.getElementById("article").innerHTML = `<h1 style="${vt}">${id.replace(/-/g, " ")}</h1>`;
      const found = await post(id);
      document.getElementById("article").innerHTML = found
        ? `<h1 style="${vt}">${found.title}</h1>
     <p class="s2-quiet"><wa-format-date date="${found.create_time}" month="long" day="numeric" year="numeric"></wa-format-date></p>
     <div style="white-space:pre-wrap; margin-block-start:1rem">${found.body}</div>`
        : '<p>Not found. <a href="./blog.html">Back</a></p>';
      document.title = (found?.title ?? "Post") + " — saastarter2 pure";
    </script>
