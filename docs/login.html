    <script>
      {
        const d = localStorage.theme === "dark",
          c = document.documentElement.classList;
        c.toggle("wa-dark", d);
        c.toggle("dark", d);
        const l = localStorage.locale === "ar" ? "ar" : "en";
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      }
    </script>

  <body>
    <s2-nav>
      <!-- SYNC: this markup is duplicated on every page so the chrome renders
           before any JavaScript. The behaviour that enhances it (and the
           fallback copy, if this is ever missing) lives in
           js/components/nav.js — change one, change both.
           Find every copy with:  grep -l s2-nav-row docs/*.html -->
      <div class="container s2-nav-row">
        <a class="s2-brand" href="./index.html">
          saastarter2
          <small>pure</small>
        </a>
        <a href="./products.html">
          <iconify-icon icon="lucide:package" inline></iconify-icon>
          Products
        </a>
        <a href="./blog.html">
          <iconify-icon icon="lucide:file-text" inline></iconify-icon>
          Blog
        </a>
        <a href="#cart" id="nav-cart">
          <iconify-icon icon="lucide:shopping-cart" inline></iconify-icon>
          Cart
          <span id="cart-count" class="s2-badge s2-hidden"></span>
        </a>
        <a href="./login.html" id="nav-account">
          <iconify-icon icon="lucide:log-in" inline></iconify-icon>
          Sign in
        </a>
        <button id="theme-toggle" aria-label="Toggle dark mode">
          <iconify-icon class="s2-when-light" icon="lucide:moon" inline></iconify-icon>
          <iconify-icon class="s2-when-dark" icon="lucide:sun" inline></iconify-icon>
        </button>
        <button id="locale-toggle" aria-label="Switch language">
          <iconify-icon icon="lucide:languages" inline></iconify-icon>
          <span class="s2-mono">ع</span>
        </button>
      </div>
    </s2-nav>
    <main class="container" style="max-inline-size: 26rem">
      <div class="s2-card" id="auth-view">
        <div class="s2-stack">
          <h1 id="auth-title" style="font-size: 1.4rem; margin: 0">Sign in</h1>
          <button class="s2-btn s2-btn-outline" type="button" id="google">
            <iconify-icon slot="start" icon="lucide:log-in"></iconify-icon>
            Continue with Google
          </button>
          <div class="s2-center s2-quiet s2-small">or</div>
          <wa-input id="name" placeholder="Name" class="s2-hidden"></wa-input>
          <wa-input id="email" type="email" placeholder="Email"></wa-input>
          <wa-input id="password" type="password" placeholder="Password" password-toggle></wa-input>
          <p id="auth-error" class="s2-small s2-hidden" style="color: var(--wa-color-danger-fill-loud); margin: 0"></p>
          <button class="s2-btn s2-btn-brand" type="button" id="submit">Sign in</button>
          <button class="s2-btn s2-btn-plain s2-btn-s" type="button" id="mode">Create an account instead</button>
          <button class="s2-btn s2-btn-plain s2-btn-s" type="button" id="forgot" style="color: var(--s2-muted)">
            Forgot password?
          </button>
        </div>
      </div>
      <div id="totp-view" class="s2-card s2-hidden">
        <div class="s2-stack">
          <h1 style="font-size: 1.4rem; margin: 0">Two-factor code</h1>
          <p class="s2-quiet s2-small" style="margin: 0">Enter the 6-digit code from your authenticator app.</p>
          <wa-otp-input id="totp-code" label="Verification code"></wa-otp-input>
          <p id="totp-error" class="s2-small s2-hidden" style="color: var(--wa-color-danger-fill-loud); margin: 0"></p>
          <button class="s2-btn s2-btn-brand" type="button" id="totp-verify">Verify</button>
        </div>
      </div>
    </main>
    <s2-footer>
      <!-- SYNC: duplicated per page (see the note on <s2-nav>); the fallback
           copy lives in js/components/footer.js — change one, change both. -->
      static on GitHub Pages · backend on Cloudflare Workers ·
      <a href="./contact.html">contact</a>
      ·
      <a href="./blog.html">blog</a>
      ·
      <a href="./admin.html">admin</a>
    </s2-footer>
    <script type="module" src="./js/pages/login.js"></script>
  </body>
</html>
