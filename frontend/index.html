<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>saastarter2 — the self-aware SaaS template</title>
    <meta name="description" content="An ecommerce shop that sells its own source code. Static storefront on GitHub Pages, declarative baas on Cloudflare Workers." />
    <!-- Hosted theme (site.md §1): the project's tweakcn document, served
         with doubled selectors so it beats the bundled defaults — edit
         ../hono-aep-baas-config/themes/default.cms.css and `sync push`,
         or restyle in the dashboard; one tag, whole site. -->
    <link rel="stylesheet" href="https://mizan-gpp.the-montiapple.workers.dev/v1/projects/b40546af-b19c-46ca-8661-87db12b3e85a/theme.css" />
    <!-- Dark mode, pre-paint: apply the stored (or OS) preference before
         first paint so there is no flash. The toggle lives in the header. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
