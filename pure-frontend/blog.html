<body>

<main class="container py-4"><div class="mx-auto" style="max-width:42rem">
  <h1>Blog</h1>
  <div id="posts" class="vstack gap-3 mt-3"><p class="text-body-secondary">Loading…</p></div>
</div></main>
<script type="module" src="./js/ui.js"></script>
<script type="module">
import { posts } from "./js/store.js";
const rows = await posts();
document.getElementById("posts").innerHTML = rows.length === 0
  ? '<p class="text-body-secondary">No posts yet.</p>'
  : rows.map((p) => `<a class="card text-decoration-none" href="./post.html?id=${p.path.split("/").pop()}"><div class="card-body"><h5 style="view-transition-name:post-${p.path.split("/").pop()}">${p.title}</h5><small class="text-body-secondary">${new Date(p.create_time).toLocaleDateString()}</small></div></a>`).join("");
</script>
