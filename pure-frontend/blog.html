<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./css/site.css"><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><title>Blog — saastarter2 pure</title></head>
<body>
<div id="nav"></div>
<main class="container py-4" style="max-width:42rem">
  <h1>Blog</h1>
  <div id="posts" class="vstack gap-3 mt-3"><p class="text-body-secondary">Loading…</p></div>
</main>
<script type="module" src="./js/ui.js"></script>
<script type="module">
import { posts } from "./js/store.js";
const rows = await posts();
document.getElementById("posts").innerHTML = rows.length === 0
  ? '<p class="text-body-secondary">No posts yet.</p>'
  : rows.map((p) => `<a class="card text-decoration-none" href="./post.html?id=${p.path.split("/").pop()}"><div class="card-body"><h5>${p.title}</h5><small class="text-body-secondary">${new Date(p.create_time).toLocaleDateString()}</small></div></a>`).join("");
</script>
</body>
</html>
