<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./css/site.css"><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><title>Post — saastarter2 pure</title></head>
<body>
<div id="nav"></div>
<main class="container py-4" style="max-width:42rem"><article id="article"><p class="text-body-secondary">Loading…</p></article></main>
<script type="module" src="./js/ui.js"></script>
<script type="module">
import { post } from "./js/store.js";
const found = await post(new URLSearchParams(location.search).get("id"));
document.getElementById("article").innerHTML = found
  ? `<h1>${found.title}</h1><p class="text-body-secondary">${new Date(found.create_time).toLocaleDateString()}</p><div class="mt-3" style="white-space:pre-wrap">${found.body}</div>`
  : '<p>Not found. <a href="./blog.html">Back</a></p>';
document.title = (found?.title ?? "Post") + " — saastarter2 pure";
</script>
</body>
</html>
