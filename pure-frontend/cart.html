<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./css/site.css"><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><title>Cart — saastarter2 pure</title></head>
<body>
<div id="nav"></div>
<main class="container py-4" style="max-width:42rem">
  <div id="cart-view">
    <h1>Your cart</h1>
    <div id="items" class="vstack gap-2 my-3"></div>
    <div class="input-group mb-2" style="max-width:24rem">
      <input id="code" class="form-control text-uppercase" placeholder="Discount code (try LAUNCH20)">
      <button id="apply" class="btn btn-outline-secondary">Apply</button>
    </div>
    <p id="coupon-line" class="text-success small d-none"></p>
    <p id="coupon-error" class="text-danger small d-none"></p>
    <div class="d-flex justify-content-between border-top pt-3 fs-5"><span>Total</span><strong id="total"></strong></div>
    <button id="checkout" class="btn btn-primary btn-lg w-100 mt-3">Checkout</button>
  </div>
  <div id="pay-view" class="d-none">
    <h1>Payment</h1>
    <p class="text-body-secondary">You never leave the store — the card fields below are the gateway's embedded element.</p>
    <button id="back" class="btn btn-link p-0 mb-3">← Back to cart (your items are safe)</button>
    <div id="payment-element" class="border rounded p-3 mb-3"></div>
    <button id="pay" class="btn btn-primary btn-lg w-100" disabled>Loading…</button>
  </div>
  <div id="done-view" class="d-none text-center py-5">
    <div style="font-size:4rem">✅</div>
    <h1 id="done-title" class="mt-3"></h1>
    <p class="text-body-secondary">Your downloads (if any) are on <a href="./account.html">your account's orders</a>.</p>
  </div>
</main>
<script type="module" src="./js/ui.js"></script>
<script type="module" src="./js/pages/cart.js"></script>
</body>
</html>
