<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://mizan-gpp.the-montiapple.workers.dev/v1/projects/b40546af-b19c-46ca-8661-87db12b3e85a/theme.css"><link rel="stylesheet" href="./css/tweakcn-adapter.css"><link rel="stylesheet" href="./css/site.css"><script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><title>Sign in — saastarter2 pure</title></head>
<body>
<div id="nav"></div>
<main class="container py-5" style="max-width:26rem">
  <div id="auth-view" class="card"><div class="card-body vstack gap-3">
    <h1 class="h4" id="auth-title">Sign in</h1>
    <button id="google" class="btn btn-outline-primary"><iconify-icon icon="lucide:log-in" inline></iconify-icon> Continue with Google</button>
    <div class="text-center text-body-tertiary small">or</div>
    <input id="name" class="form-control d-none" placeholder="Name">
    <input id="email" type="email" class="form-control" placeholder="Email">
    <input id="password" type="password" class="form-control" placeholder="Password">
    <p id="auth-error" class="text-danger small d-none mb-0"></p>
    <button id="submit" class="btn btn-primary">Sign in</button>
    <button id="mode" class="btn btn-link btn-sm">Create an account instead</button>
    <button id="forgot" class="btn btn-link btn-sm text-body-secondary">Forgot password?</button>
  </div></div>
  <div id="totp-view" class="card d-none"><div class="card-body vstack gap-3">
    <h1 class="h4">Two-factor code</h1>
    <p class="text-body-secondary small mb-0">Enter the 6-digit code from your authenticator app.</p>
    <input id="totp-code" inputmode="numeric" class="form-control" placeholder="123456">
    <p id="totp-error" class="text-danger small d-none mb-0"></p>
    <button id="totp-verify" class="btn btn-primary">Verify</button>
  </div></div>
</main>
<script type="module" src="./js/ui.js"></script>
<script type="module" src="./js/pages/login.js"></script>
</body>
</html>
