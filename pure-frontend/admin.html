<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://mizan-gpp.the-montiapple.workers.dev/v1/projects/b40546af-b19c-46ca-8661-87db12b3e85a/theme.css"><link rel="stylesheet" href="./css/tweakcn-adapter.css"><link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./css/site.css"><script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><title>Admin — saastarter2</title><meta name="robots" content="noindex"></head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <div id="gate" class="mx-auto card" style="max-width:26rem">
    <div class="card-body vstack gap-3">
      <p class="s2-kicker mb-0">store admin</p>
      <h1 class="h4">Unlock with your sk_ key</h1>
      <p class="text-body-secondary small mb-0">The key from <code>.owner-creds.json</code>. Stored in this browser only; every action below is the public API under your key's policies.</p>
      <input id="key-input" type="password" class="form-control" placeholder="sk_live_…">
      <p id="gate-error" class="text-danger small d-none mb-0"></p>
      <button id="unlock" class="btn btn-primary"><iconify-icon icon="lucide:key" inline></iconify-icon> Unlock</button>
    </div>
  </div>
  <div id="studio" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
      <div><p class="s2-kicker mb-0">store admin</p><h1 class="h3 mb-0">saastarter2</h1></div>
      <div class="d-flex gap-2 align-items-center">
        <select id="admin-locale" class="form-select form-select-sm w-auto"></select>
        <button id="lock" class="btn btn-sm btn-outline-secondary">Lock</button>
      </div>
    </div>
    <!-- Stats/Orders are the commerce surface (bespoke panes, gated by
         site.admin.commerce); every collection tab after them is GENERATED
         from site.admin.collections + the project's own openapi.json by
         js/vendor/hono-aep-bootstrap-ui.js. Adding a collection to the
         config repo makes it appear here with zero UI code. -->
    <ul class="nav nav-tabs" id="admin-tabs" role="tablist">
      <li class="nav-item" data-commerce><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-stats">Stats</button></li>
      <li class="nav-item" data-commerce><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-orders">Orders</button></li>
    </ul>
    <div class="tab-content pt-3" id="admin-panes">
      <div class="tab-pane fade show active" id="tab-stats">
        <div class="row g-3" id="stat-cards"></div>
        <p class="s2-kicker mt-4 mb-2">top products</p>
        <div id="top-products" class="vstack gap-2"></div>
      </div>
      <div class="tab-pane fade" id="tab-orders"><div id="orders-list" class="vstack gap-2 pt-1"></div></div>
    </div>
  </div>
  <p class="text-center small text-body-secondary mt-4">Definitions (collections, themes, pages, forms) live in the <a href="https://mizan-gpp.the-montiapple.workers.dev/studio">developer studio</a> on the platform.</p>
</main>
<script type="module" src="./js/ui.js"></script>
<script type="module" src="./js/pages/admin.js"></script>
</body>
</html>
